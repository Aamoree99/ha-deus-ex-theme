  # card-mod
  card-mod-theme: cyberpunk-2077

  card-mod-root: |
    ha-button-menu,
    mwc-menu,
    paper-dropdown-menu {
      overflow: visible;
      clip-path: none !important;
    }

    ha-label-badge {
      --label-badge-color: var(--cyan-color);
      color: var(--dark-purple-color);
    }

    .badge {
      color: var(--cyan-color);
    }

    ha-map .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) saturate(0.8) brightness(0.85);
    }

    ha-map .leaflet-control {
      filter: invert(1) hue-rotate(180deg);
    }

  card-mod-card: |
    ha-card {
      position: relative;
      background: var(--dark-purple-color);
      border-radius: 1px;
      overflow: visible;
      clip-path: polygon(
        0% 0%,
        26px 0%,
        34px 8px,
        100% 8px,
        100% 100%,
        14px 100%,
        0% calc(100% - 14px)
      );
      font-family: var(--primary-font-family);
      transition: background-color 160ms ease-out, filter 160ms ease-out;
    }

    ha-card:before {
      content: '';
      position: absolute;
      inset: 0;
      padding: 1px;
      clip-path: polygon(
        0% 0%,
        26px 0%,
        34px 8px,
        100% 8px,
        100% 100%,
        14px 100%,
        0% calc(100% - 14px)
      );
      background: linear-gradient(135deg, var(--red-color) 0%, var(--dark-red-color) 42%, var(--dark-red-color) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 0;
    }

    ha-card:after {
      content: '';
      position: absolute;
      top: 8px;
      left: 26px;
      width: 5px;
      height: 5px;
      background: var(--red-color);
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--dark-purple-color), 0 0 0 3px var(--dark-red-color);
      pointer-events: none;
      z-index: 0;
    }

    ha-card > * {
      position: relative;
      z-index: 1;
    }

    ha-card:hover {
      background: #1D1520;
      filter: brightness(1.08);
    }

    ha-card:hover:before {
      background: linear-gradient(135deg, var(--cyan-color) 0%, var(--red-color) 42%, var(--dark-red-color) 100%);
    }

    /* Picture-based cards (floorplans, camera stills, glances over an image):
       the deco frame and card background fight the image content, so these
       opt out entirely and stay flat/transparent. */
    hui-picture-elements-card ha-card,
    hui-picture-card ha-card,
    hui-picture-glance-card ha-card {
      clip-path: none !important;
      background: transparent !important;
      filter: none !important;
    }

    hui-picture-elements-card ha-card:before,
    hui-picture-elements-card ha-card:after,
    hui-picture-card ha-card:before,
    hui-picture-card ha-card:after,
    hui-picture-glance-card ha-card:before,
    hui-picture-glance-card ha-card:after {
      content: none !important;
      display: none !important;
    }

  card-mod-sidebar: |
    @-webkit-keyframes blink {
      0% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
      100% {
        opacity: 0;
      }
    }

    .menu .title {
      color: var(--cyan-color);
      font-family: var(--primary-font-family);
      font-weight: bold;
      margin-top: 4px;
      text-shadow: 0 0 10px var(--cyan-color),
                   0 0 20px var(--cyan-color);
      text-transform: uppercase;
    }

    .menu ha-icon-button {
      color: var(--cyan-color) !important;
    }

    paper-icon-item span,
    paper-icon-item:hover span {
      text-transform: uppercase;
      z-index: 1;
    }

    paper-icon-item:hover span,
    paper-icon-item:hover ha-icon,
    paper-icon-item:hover ha-svg-icon,
    a[aria-selected=true] paper-icon-item span,
    a[aria-selected=true] paper-icon-item ha-icon,
    a[aria-selected=true] paper-icon-item ha-svg-icon {
      color: var(--cyan-color);
      font-weight: bold;
      text-shadow: 0 0 10px var(--cyan-color);
    }

    paper-icon-item:hover ha-icon,
    paper-icon-item:hover ha-svg-icon,
    a[aria-selected=true] paper-icon-item ha-icon,
    a[aria-selected=true] paper-icon-item ha-svg-icon {
      animation: blink 250ms infinite alternate
    }

    paper-icon-item {
      background-color: var(--red-color);
      border-radius: 1px !important;
      clip-path: polygon(
        0px calc(100% - 7px),
        1px calc(100% - 9px),
        1px calc(100% - 20px),
        0px calc(100% - 22px),
        0px 0px,
        100% 0px, 
        100% calc(100% - 10px), 
        calc(100% - 10px) 100%, 
        0px 100%
      );
    }

    paper-icon-item:before {
      background: var(--dark-red-color);
      clip-path: polygon(
        5px 0px,
        100% 0px, 
        100% calc(100% - 10px), 
        calc(100% - 10px) 100%, 
        5px 100%
      );
      content: '';
      display: block;
      height: calc(100% - 2px);
      left: 1px;
      position: absolute;
      top: 1px;
      width: calc(100% - 2px);
      z-index: -1;
    }

    paper-icon-item,
    paper-icon-item:before {
      transition: background-color 100ms ease-out, color 100ms ease-out; 
    }

    paper-icon-item:after {
      background-color: var(--red-color);
      content: '';
      display: block;
      height: 100%;
      left: 5px;
      position: absolute;
      top: 0px;
      width: 1px;
    }

    paper-icon-item:hover,
    paper-icon-item:hover:after,
    a[aria-selected=true] paper-icon-item,
    a[aria-selected=true] paper-icon-item:after {
      color: var(--cyan-color); 
      background-color: var(--cyan-color); 
    }

    paper-icon-item:hover:before {
      background-color: var(--dark-red-color);
    }

    .iron-selected paper-icon-item:focus::before,
    paper-icon-item:focus:before,
    a[aria-selected=true] paper-icon-item:before {
      background-color: var(--dark-cyan-color); 
    }

    .iron-selected paper-icon-item:focus::before,
    paper-icon-item:hover:before,
    paper-icon-item:focus:before,
    a[aria-selected=true] paper-icon-item:before {
      border-radius: 1px;
      position: absolute;
      inset: 1px 1px;
      pointer-events: none;
      content: "";
      will-change: auto;
      opacity: 1 !important;
    }

    div.tooltip {
      color: var(--dark-purple-color);
      background-color: var(--cyan-color);
    }

