  # card-mod
  card-mod-theme: Deus Ex MD

  card-mod-root: |
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap');

    ha-button-menu,
    mwc-menu,
    paper-dropdown-menu {
      overflow: visible;
      clip-path: none !important;
    }

    /* ---- Deus Ex typography: mono-caps labels, condensed values ---- */
    hui-tile-card,
    hui-glance-card,
    hui-entities-card,
    hui-sensor-card {
      --ha-card-header-font-family: var(--dx-font-display);
    }
    hui-tile-card $ .primary,
    hui-tile-card $ ha-tile-info $ .primary {
      font-family: var(--dx-font-display) !important;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--dx-value);
    }
    hui-tile-card $ .secondary,
    hui-tile-card $ ha-tile-info $ .secondary {
      font-family: var(--dx-font-mono) !important;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dx-label);
    }
    /* section / heading titles */
    hui-heading $ .content .heading,
    h1.card-header, .card-header {
      font-family: var(--dx-font-display) !important;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--dx-gold);
      font-weight: 700;
    }

    ha-label-badge {
      --label-badge-color: var(--cyan-color);
      color: var(--dark-purple-color);
    }

    .badge {
      color: var(--cyan-color);
    }

    ha-map .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) saturate(0.8) brightness(0.85);
    }

    ha-map .leaflet-control {
      filter: invert(1) hue-rotate(180deg);
    }

  card-mod-card: |
    /* ============================================================
       THE FRAME — лакированное дерево / латунный кант / заклёпка
       mirrors dist/deus-ex-card.js
       ============================================================ */
    ha-card {
      position: relative;
      overflow: visible;
      border-radius: 2px;
      font-family: var(--dx-font-display);
      color: var(--dx-value);
      background:
        repeating-linear-gradient(178deg,
          rgba(255,224,180,.015) 0 3px, rgba(0,0,0,0) 3px 11px,
          rgba(0,0,0,.03) 11px 13px, rgba(0,0,0,0) 13px 26px),
        radial-gradient(150% 100% at 22% -20%, rgba(255,214,150,.07), rgba(255,214,150,0) 58%),
        linear-gradient(180deg, var(--dx-wood-1) 0%, var(--dx-wood-2) 48%, var(--dx-wood-3) 100%);
      box-shadow:
        0 1px 0 rgba(255,228,175,.06) inset,
        0 -16px 26px rgba(0,0,0,.30) inset,
        0 7px 16px rgba(0,0,0,.50),
        0 1px 2px rgba(0,0,0,.60);
      clip-path: polygon(0 11px, 11px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
      transition: box-shadow 180ms ease, transform 180ms ease;
    }
    ha-card:before { /* brass hairline follows the cut corners */
      content: '';
      position: absolute; inset: 0; padding: 1px; border-radius: 2px;
      clip-path: polygon(0 11px, 11px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
      background: linear-gradient(138deg, var(--dx-brass-lit) 0%, var(--dx-brass) 34%, var(--dx-brass-deep) 78%, #402d14 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 0;
    }
    ha-card:after { /* заклёпка on the top-left notch */
      content: '';
      position: absolute; top: 5px; left: 5px; width: 7px; height: 7px; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #F8E6B4 0%, #CE9E46 46%, #835c2c 78%, #4a361c 100%);
      box-shadow: 0 1px 1px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
      pointer-events: none;
      z-index: 2;
    }
    ha-card > * { position: relative; z-index: 1; }
    ha-card:hover {
      transform: translateY(-1px);
      box-shadow:
        0 1px 0 rgba(255,228,175,.10) inset,
        0 -16px 26px rgba(0,0,0,.28) inset,
        0 12px 24px rgba(0,0,0,.55),
        0 0 0 1px rgba(234,209,150,.16);
    }
    @media (prefers-reduced-motion: reduce) {
      ha-card { transition: none; }
      ha-card:hover { transform: none; }
    }

    /* Picture-based cards (floorplans, camera stills): frame fights the image,
       so they opt out and stay flat/transparent. */
    hui-picture-elements-card ha-card,
    hui-picture-card ha-card,
    hui-picture-glance-card ha-card,
    hui-image-card ha-card {
      clip-path: none !important;
      background: transparent !important;
      box-shadow: none !important;
      transform: none !important;
    }
    hui-picture-elements-card ha-card:before, hui-picture-elements-card ha-card:after,
    hui-picture-card ha-card:before, hui-picture-card ha-card:after,
    hui-picture-glance-card ha-card:before, hui-picture-glance-card ha-card:after,
    hui-image-card ha-card:before, hui-image-card ha-card:after {
      content: none !important;
      display: none !important;
    }

    /* ---- TILE: HUD icon plate + gold active glow ---- */
    hui-tile-card $ ha-card ha-tile-icon $ .container,
    hui-tile-card $ ha-card .icon-container ha-tile-icon $ .container {
      border-radius: 2px;
      background: linear-gradient(180deg, #241a0d, #160f07);
      border: 1px solid var(--dx-brass-deep);
      clip-path: polygon(0 5px, 5px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
      color: var(--dx-gold);
    }
    hui-tile-card[data-state="on"] $ ha-card ha-tile-icon $ .container,
    hui-tile-card[data-state="heat"] $ ha-card ha-tile-icon $ .container,
    hui-tile-card[data-state="playing"] $ ha-card ha-tile-icon $ .container {
      background: linear-gradient(180deg, #4a3813, #2c2009);
      border-color: var(--dx-gold);
      box-shadow: 0 0 10px rgba(212,169,58,.35);
    }

    /* ---- BUTTON card: HUD action ---- */
    hui-button-card $ ha-card {
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      background: linear-gradient(180deg, #241a0d, #150e07);
    }
    hui-button-card $ ha-card:hover { box-shadow: 0 0 14px rgba(212,169,58,.30); }

    /* ---- mini-graph-card: gold readout ---- */
    mini-graph-card $ ha-card {
      --accent-color: var(--dx-gold);
    }

    /* ---- markdown / heading card used as a section title ---- */
    hui-markdown-card $ ha-card h1,
    hui-markdown-card $ ha-card h2 {
      font-family: var(--dx-font-display);
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--dx-gold);
    }

  card-mod-sidebar: |
    @-webkit-keyframes blink {
      0% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
      100% {
        opacity: 0;
      }
    }

    .menu .title {
      color: var(--cyan-color);
      font-family: var(--primary-font-family);
      font-weight: bold;
      margin-top: 4px;
      text-shadow: 0 0 10px var(--cyan-color),
                   0 0 20px var(--cyan-color);
      text-transform: uppercase;
    }

    .menu ha-icon-button {
      color: var(--cyan-color) !important;
    }

    paper-icon-item span,
    paper-icon-item:hover span {
      text-transform: uppercase;
      z-index: 1;
    }

    paper-icon-item:hover span,
    paper-icon-item:hover ha-icon,
    paper-icon-item:hover ha-svg-icon,
    a[aria-selected=true] paper-icon-item span,
    a[aria-selected=true] paper-icon-item ha-icon,
    a[aria-selected=true] paper-icon-item ha-svg-icon {
      color: var(--cyan-color);
      font-weight: bold;
      text-shadow: 0 0 10px var(--cyan-color);
    }

    paper-icon-item:hover ha-icon,
    paper-icon-item:hover ha-svg-icon,
    a[aria-selected=true] paper-icon-item ha-icon,
    a[aria-selected=true] paper-icon-item ha-svg-icon {
      animation: blink 250ms infinite alternate
    }

    paper-icon-item {
      background-color: var(--red-color);
      border-radius: 1px !important;
      clip-path: polygon(
        0px calc(100% - 7px),
        1px calc(100% - 9px),
        1px calc(100% - 20px),
        0px calc(100% - 22px),
        0px 0px,
        100% 0px, 
        100% calc(100% - 10px), 
        calc(100% - 10px) 100%, 
        0px 100%
      );
    }

    paper-icon-item:before {
      background: var(--dark-red-color);
      clip-path: polygon(
        5px 0px,
        100% 0px, 
        100% calc(100% - 10px), 
        calc(100% - 10px) 100%, 
        5px 100%
      );
      content: '';
      display: block;
      height: calc(100% - 2px);
      left: 1px;
      position: absolute;
      top: 1px;
      width: calc(100% - 2px);
      z-index: -1;
    }

    paper-icon-item,
    paper-icon-item:before {
      transition: background-color 100ms ease-out, color 100ms ease-out; 
    }

    paper-icon-item:after {
      background-color: var(--red-color);
      content: '';
      display: block;
      height: 100%;
      left: 5px;
      position: absolute;
      top: 0px;
      width: 1px;
    }

    paper-icon-item:hover,
    paper-icon-item:hover:after,
    a[aria-selected=true] paper-icon-item,
    a[aria-selected=true] paper-icon-item:after {
      color: var(--cyan-color); 
      background-color: var(--cyan-color); 
    }

    paper-icon-item:hover:before {
      background-color: var(--dark-red-color);
    }

    .iron-selected paper-icon-item:focus::before,
    paper-icon-item:focus:before,
    a[aria-selected=true] paper-icon-item:before {
      background-color: var(--dark-cyan-color); 
    }

    .iron-selected paper-icon-item:focus::before,
    paper-icon-item:hover:before,
    paper-icon-item:focus:before,
    a[aria-selected=true] paper-icon-item:before {
      border-radius: 1px;
      position: absolute;
      inset: 1px 1px;
      pointer-events: none;
      content: "";
      will-change: auto;
      opacity: 1 !important;
    }

    div.tooltip {
      color: var(--dark-purple-color);
      background-color: var(--cyan-color);
    }

